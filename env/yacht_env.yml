name: yacht_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>3.6,<3.12
  - sourmash>=4.8.3,<5
  - scipy
  - numpy>=1.22.4
  - pandas
  - scikit-learn
  - codecov
  - pytest
  - pytest-cov
  - loguru
  - maturin>=1,<2
  - tqdm
  - biom-format
  - pytaxonkit
  - requests
  - pip
  - sourmash_plugin_branchwater
  # build tools for the native parts of YACHT (C++ train core, Rust run index)
  - cxx-compiler
  - make
  - rust>=1.80
  - setuptools-rust>=1.7
  - pip:
    - openpyxl
    - ruff